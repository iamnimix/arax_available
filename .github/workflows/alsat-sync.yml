name: همگام‌سازی با آلسات
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alsat-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/alsat_sync.py
      - name: Commit changes
        run: |
          git config user.name "arax-sync"
          git config user.email "sync@users.noreply.github.com"
          git add data images
          if ! git diff --cached --quiet; then
            git commit -m "sync from alsat"
            git pull --rebase
            git push
          fi

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت آراکس</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand"><img src="images/logo.png" alt="" onerror="this.style.display='none'"><b>پنل مدیریت آراکس ARAX</b></div>
  <a class="btn ghost sm" href="index.html">مشاهده ویترین</a>
  <button class="btn sm hide" id="logout">خروج</button>
</header>

<div class="panel">
  <!-- ورود -->
  <section id="login">
    <h2>ورود</h2>
    <div class="msg">رمز ورود شما همان «توکن گیت‌هاب» است (راهنما در README). فقط یک‌بار وارد می‌کنید و روی همین مرورگر ذخیره می‌شود.</div>
    <div class="field"><label>رمز ورود (توکن)</label><input id="token" type="password" dir="ltr" placeholder="github_pat_..."></div>
    <div class="row">
      <div class="field"><label>نام کاربری گیت‌هاب</label><input id="owner" dir="ltr"></div>
      <div class="field"><label>نام ریپازیتوری</label><input id="repo" dir="ltr"></div>
    </div>
    <div class="field"><label>برنچ</label><input id="branch" dir="ltr" value="main"></div>
    <button class="btn" id="loginBtn">ورود</button>
    <div id="lmsg"></div>
  </section>

  <!-- پنل -->
  <section id="app" class="hide">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2>محصولات</h2><button class="btn" id="newBtn">+ محصول جدید</button>
    </div>
    <div id="list"></div>
    <div id="gmsg"></div>
  </section>
</div>

<div class="modal" id="fm"><div class="box">
  <button class="x" id="fclose">×</button>
  <h2 id="ftitle">محصول جدید</h2>
  <div class="field"><label>نام محصول</label><input id="f_name"></div>
  <div class="row">
    <div class="field"><label>قیمت (تومان)</label><input id="f_price" type="number" inputmode="numeric"></div>
    <div class="field"><label>موجودی (تعداد پک)</label><input id="f_stock" type="number" inputmode="numeric"></div>
  </div>
  <div class="field"><label>جنس</label><input id="f_material"></div>
  <div class="row">
    <div class="field"><label>تعداد رنگ</label><input id="f_colors"></div>
    <div class="field"><label>تعداد در پک</label><input id="f_pack"></div>
  </div>
  <div class="field"><label>توضیحات (اختیاری)</label><textarea id="f_desc" rows="2"></textarea></div>
  <div class="field"><label>عکس‌ها (حداکثر ۴ عدد؛ عکس اول، تصویر اصلی است)</label>
    <div class="slots" id="slots"></div>
    <input type="file" id="file" accept="image/*" class="hide">
  </div>
  <div id="fmsg"></div>
  <button class="btn" id="saveBtn">ذخیره</button>
</div></div>

<script src="js/admin.js"></script>
</body>
</html>
